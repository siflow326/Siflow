<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Secret Space ❤️</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* خلفية هالو كيتي كيوت ومتنوعة وغير متكررة */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle, rgba(244,63,94,0.08) 10%, transparent 10%),
                url('https://i.pinimg.com/originals/8e/52/63/8e5263a23a31bb36371714bc1912f2ee.png'), 
                url('https://i.pinimg.com/736x/82/35/6c/82356c2227d825c952b610c144e3752e.jpg'),
                url('https://i.pinimg.com/736x/2c/8f/c7/2c8fc72545bc6c8872b8140db59cb833.jpg'),
                url('https://i.pinimg.com/736x/e4/14/67/e4146747b6672323a63327d55f013d7e.jpg');
            background-repeat: repeat, space, space, space, space;
            background-size: 160px, 130px, 140px, 120px, 150px;
            opacity: 0.16;
            z-index: -1;
            pointer-events: none;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #f43f5e;
            margin-top: 20px;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
        }
        .couple-name {
            font-size: 1.1rem;
            color: #fb7185;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(244, 63, 94, 0.3);
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }
        .counter-box, .chat-box {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.1);
            text-align: right;
        }
        .timer {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }
        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-num {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fb7185;
        }
        .time-label {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .btn-miss {
            background: linear-gradient(135deg, #e11d48, #f43f5e);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }
        .btn-miss:active {
            transform: scale(0.97);
        }
        .message-box {
            display: none;
            background: rgba(244, 63, 94, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid #f43f5e50;
            color: #fda4af;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 1.05rem;
            font-weight: 500;
        }
        .chat-messages {
            height: 200px;
            overflow-y: auto;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-msg {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            max-width: 85%;
        }
        .chat-msg .sender {
            font-size: 0.7rem;
            color: #fb7185;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }
        .chat-input-area {
            display: flex;
            gap: 5px;
            flex-direction: column;
        }
        .chat-input-area input {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .chat-input-area button {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: right;
            border-right: 4px solid #f43f5e;
        }
        .card h3 { font-size: 1rem; color: #f8fafc; margin-bottom: 5px; }
        .card p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
        .card img { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 300px; object-fit: cover; }
        
        .admin-panel {
            display: none;
            background: #020617;
            border: 1px solid #f43f5e;
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
            text-align: right;
        }
        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px 0;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .admin-panel button {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .delete-btn { background: #ef4444 !important; font-size: 0.75rem; padding: 4px 8px; float: left; }
        .list-item { background: #0f172a; padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h1 onclick="secretAdminTrigger()">مساحتنا الخاصة ❤️</h1>
    <div class="couple-name">AMINA ♾️ OUSSAMA</div>
    <p class="subtitle">كل لحظة معك هي بداية لذكرى أجمل</p>

    <!-- العدادات -->
    <div id="countersContainer"></div>

    <!-- زر رسائل الشوق -->
    <button class="btn-miss" onclick="showRandomMessage()">اضغطي هنا عندما تشتاقين لي 💌</button>
    <div class="message-box" id="secretMessage"></div>

    <!-- قسم الشات المباشر -->
    <div class="chat-box">
        <h3 style="color: #f43f5e; font-size: 1rem; margin-bottom: 8px;">💬 الشات المباشر بيننا</h3>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatName" placeholder="اكتب اسمك هنا...">
            <input type="text" id="chatText" placeholder="اكتب رسالتك واضغط إرسال..." onkeypress="checkEnter(event)">
            <button onclick="sendChatMessage()">إرسال الرسالة</button>
        </div>
    </div>

    <!-- قائمة الذكريات -->
    <div id="memoriesContainer"></div>

    <!-- لوحة التحكم السرية -->
    <div class="admin-panel" id="adminPanel">
        <h3 style="color:#f43f5e; border-bottom:1px solid #1e293b; padding-bottom:5px; margin-bottom:10px;">لوحة التحكم 🔒</h3>
        <h3>إدارة رسائل الشوق</h3>
        <textarea id="newRandomMsg" placeholder="رسالة جديدة..."></textarea>
        <button onclick="addRandomMessage()">إضافة رسالة</button>
        <div id="adminRandomList" style="max-height: 100px; overflow-y: auto; margin-bottom: 10px;"></div>

        <h3>إضافة ذكرى جديدة</h3>
        <input type="text" id="memTitle" placeholder="العنوان">
        <textarea id="memDesc" placeholder="التفاصيل..."></textarea>
        <input type="text" id="memMedia" placeholder="رابط الصورة URL">
        <button onclick="addMemory()">نشر الذكرى للجميع</button>
        <div id="adminMemoriesList" style="max-height: 120px; overflow-y: auto;"></div>
        
        <button style="background:#334155; width:100%; margin-top:10px;" onclick="closeAdmin()">إغلاق</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://siflow-space-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let defaultMessages = [
        "تذكري دائماً أنكِ أجمل جزء في يومي وحياتي كلها! ❤️",
        "حتى وأنتِ بعيدة، أنتِ أقرب شيء لقلبي في كل ثانية. 🌸",
        "مهما كان يومكِ متعباً، تذكري أن هناك شخصاً يحبكِ جداً وينتظر ضحكتكِ! 🥰"
    ];

    let events = [
        { id: 1, title: "بداية تعارفنا ✨", date: "2025-03-02" },
        { id: 2, title: "تاريخ ارتباطنا الرسمي ❤️", date: "2026-01-01" }
    ];

    db.ref('messages').on('value', (snapshot) => {
        const data = snapshot.val();
        window.randomMessages = data ? data : defaultMessages;
    });

    db.ref('memories').on('value', (snapshot) => {
        const data = snapshot.val();
        window.memories = data ? data : [{ title: "أول لقاء مميز ✨", desc: "اليوم الذي بدأت فيه أحلى قصة.", media: "" }];
        renderMemories();
    });

    db.ref('chat').on('value', (snapshot) => {
        const chatContainer = document.getElementById('chatMessages');
        chatContainer.innerHTML = '';
        const data = snapshot.val();
        if(data) {
            Object.values(data).forEach(msg => {
                chatContainer.innerHTML += `
                    <div class="chat-msg">
                        <span class="sender">${msg.name}</span>
                        <span>${msg.text}</span>
                    </div>
                `;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    });

    function sendChatMessage() {
        const name = document.getElementById('chatName').value.trim();
        const text = document.getElementById('chatText').value.trim();
        if(name && text) {
            db.ref('chat').push({ name, text, time: Date.now() });
            document.getElementById('chatText').value = '';
        } else {
            alert("يرجى كتابة الاسم ورسالتك أولاً!");
        }
    }

    function checkEnter(e) {
        if(e.key === 'Enter') sendChatMessage();
    }

    function renderCounters() {
        const container = document.getElementById('countersContainer');
        container.innerHTML = '';
        events.forEach(ev => {
            container.innerHTML += `
                <div class="counter-box">
                    <p style="color: #fda4af; font-size: 0.85rem; font-weight: bold;">${ev.title}:</p>
                    <div class="timer" data-date="${ev.date}">
                        <div class="time-unit"><span class="time-num years">0</span><span class="time-label">سنة</span></div>
                        <div class="time-unit"><span class="time-num months">0</span><span class="time-label">شهر</span></div>
                        <div class="time-unit"><span class="time-num days">0</span><span class="time-label">يوم</span></div>
                        <div class="time-unit"><span class="time-num hours">0</span><span class="time-label">ساعة</span></div>
                        <div class="time-unit"><span class="time-num minutes">0</span><span class="time-label">دقيقة</span></div>
                        <div class="time-unit"><span class="time-num seconds">0</span><span class="time-label">ثانية</span></div>
                    </div>
                </div>
            `;
        });
    }

    function updateTimers() {
        const now = new Date();
        document.querySelectorAll('.timer').forEach(timer => {
            const targetDate = new Date(timer.getAttribute('data-date'));
            let diff = now - targetDate;
            if(diff > 0) {
                let years = now.getFullYear() - targetDate.getFullYear();
                let months = now.getMonth() - targetDate.getMonth();
                let days = now.getDate() - targetDate.getDate();
                if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
                if (months < 0) { years--; months += 12; }
                timer.querySelector('.years').innerText = years;
                timer.querySelector('.months').innerText = months;
                timer.querySelector('.days').innerText = days;
                timer.querySelector('.hours').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
                timer.querySelector('.minutes').innerText = Math.floor((diff / 1000 / 60) % 60);
                timer.querySelector('.seconds').innerText = Math.floor((diff / 1000) % 60);
            }
        });
    }
    setInterval(updateTimers, 1000);

    function renderMemories() {
        const container = document.getElementById('memoriesContainer');
        if(!container) return;
        container.innerHTML = '';
        if(window.memories) {
            window.memories.forEach(mem => {
                let mediaHTML = mem.media ? `<img src="${mem.media}" alt="Media">` : '';
                container.innerHTML += `
                    <div class="card">
                        <h3>${mem.title}</h3>
                        <p>${mem.desc}</p>
                        ${mediaHTML}
                    </div>
                `;
            });
        }
    }

    function showRandomMessage() {
        const msgs = window.randomMessages || defaultMessages;
        const msgBox = document.getElementById('secretMessage');
        const randomIdx = Math.floor(Math.random() * msgs.length);
        msgBox.innerText = msgs[randomIdx];
        msgBox.style.display = 'block';
    }

    let clickCount = 0;
    function secretAdminTrigger() {
        clickCount++;
        setTimeout(() => { clickCount = 0; }, 1000);
        if (clickCount === 3) {
            clickCount = 0;
            const pwd = prompt("أدخل كلمة السر (1976):");
            if (pwd === "1976") {
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminLists();
            }
        }
    }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

    function renderAdminLists() {
        const rList = document.getElementById('adminRandomList');
        rList.innerHTML = '';
        (window.randomMessages || []).forEach((msg, idx) => {
            rList.innerHTML += `<div class="list-item"><span>${msg.substring(0,25)}...</span> <button class="delete-btn" onclick="deleteRandom(${idx})">حذف</button></div>`;
        });
        const mList = document.getElementById('adminMemoriesList');
        mList.innerHTML = '';
        (window.memories || []).forEach((mem, idx) => {
            mList.innerHTML += `<div class="list-item"><span>${mem.title}</span> <button class="delete-btn" onclick="deleteMemory(${idx})">حذف</button></div>`;
        });
    }

    function addRandomMessage() {
        const txt = document.getElementById('newRandomMsg').value;
        if(txt) {
            let msgs = window.randomMessages || defaultMessages;
            msgs.push(txt);
            db.ref('messages').set(msgs);
            document.getElementById('newRandomMsg').value = '';
            renderAdminLists();
            alert("تمت الإضافة للجميع بنجاح!");
        }
    }
    function deleteRandom(idx) {
        let msgs = window.randomMessages || defaultMessages;
        msgs.splice(idx, 1);
        db.ref('messages').set(msgs);
        renderAdminLists();
    }

    function addMemory() {
        const title = document.getElementById('memTitle').value;
        const desc = document.getElementById('memDesc').value;
        const media = document.getElementById('memMedia').value;
        if(title && desc) {
            let mems = window.memories || [];
            mems.unshift({ title, desc, media });
            db.ref('memories').set(mems);
            document.getElementById('memTitle').value = '';
            document.getElementById('memDesc').value = '';
            document.getElementById('memMedia').value = '';
            renderAdminLists();
            alert("تم نشر الذكرى للجميع بنجاح!");
        }
    }
    function deleteMemory(idx) {
        let mems = window.memories || [];
        mems.splice(idx, 1);
        db.ref('memories').set(mems);
        renderAdminLists();
    }

    renderCounters();
    updateTimers();
</script>

</body>
</html>
