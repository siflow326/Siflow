<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siflow & Amine Chat Room + Siflow AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Top Navigation / Header */
        header {
            background: #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background: #334155;
            border: none;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn.active {
            background: #0284c7;
            color: #fff;
        }
        .tab-btn:hover {
            background: #475569;
        }

        /* Container Views */
        .view-container {
            flex: 1;
            display: none;
            flex-direction: column;
            position: relative;
            height: calc(100vh - 65px);
        }
        .view-container.active {
            display: flex;
        }

        /* Chat Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0f172a;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.sent {
            align-self: flex-end;
            background: #0284c7;
            color: #fff;
            border-bottom-left-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background: #334155;
            color: #f8fafc;
            border-bottom-right-radius: 2px;
        }
        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
            text-align: left;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #334155;
            padding: 10px 14px;
            border-radius: 12px;
            border-bottom-right-radius: 2px;
            align-items: center;
            gap: 4px;
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Input Bar */
        .chat-input-bar {
            padding: 12px 20px;
            background: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #334155;
        }
        .chat-input-bar input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            padding: 10px 16px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input-bar input:focus {
            border-color: #38bdf8;
        }
        .send-btn {
            background: #0284c7;
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .send-btn:hover {
            background: #0369a1;
        }

        /* Siflow AI specific styling */
        .ai-header-badge {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <i class="fa-solid fa-shield-halved" style="color: #38bdf8;"></i> Siflow Portal
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('mainChat', this)">
                <i class="fa-solid fa-comments"></i> الشات الرئيسي
            </button>
            <button class="tab-btn" onclick="switchTab('siflowAi', this)">
                <i class="fa-solid fa-robot" style="color: #38bdf8;"></i> Siflow AI
            </button>
        </div>
    </header>

    <!-- Main Chat View -->
    <div id="mainChat" class="view-container active">
        <div class="chat-messages" id="mainMessages">
            <div class="message received">
                أهلاً بك! هذا هو الشات الرئيسي المخصص.
                <div class="message-time">10:00 م</div>
            </div>
        </div>
        <div class="typing-indicator" id="mainTyping">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
        <div class="chat-input-bar">
            <input type="text" id="mainInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleMainKey(event)">
            <button class="send-btn" onclick="sendMainMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Siflow AI View -->
    <div id="siflowAi" class="view-container">
        <div style="background: #1e293b; padding: 10px 20px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 35px; height: 35px; background: #0284c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;">SF</div>
                <div>
                    <div style="font-weight: 700; font-size: 0.95rem;">Siflow AI Assistant</div>
                    <div style="font-size: 0.75rem; color: #38bdf8;">متصل للرد على كل استفساراتك</div>
                </div>
            </div>
            <span class="ai-header-badge">PRO v1.0</span>
        </div>
        <div class="chat-messages" id="aiMessages">
            <div class="message received" style="border-left: 3px solid #38bdf8;">
                مرحباً! أنا مساعدك الذكي <strong>Siflow AI</strong>. اسألني أي شيء تحب معرفته، وسأجيبك فوراً بكل سرور! ✨
                <div class="message-time">الآن</div>
            </div>
        </div>
        <div class="typing-indicator" id="aiTyping">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
        <div class="chat-input-bar">
            <input type="text" id="aiInput" placeholder="اسأل Siflow AI أي شيء..." onkeypress="handleAiKey(event)">
            <button class="send-btn" onclick="sendAiMessage()" style="background: #0284c7;"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
        </div>
    </div>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function getTimeString() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'م' : 'صباحاً';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        // Main Chat Logic
        function sendMainMessage() {
            const input = document.getElementById('mainInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('mainMessages', text, 'sent');
            input.value = '';

            // Simulate typing indicator & response
            showTyping('mainTyping', true);
            setTimeout(() => {
                showTyping('mainTyping', false);
                appendMessage('mainMessages', 'تم استلام رسالتك بنجاح في الشات الرئيسي! 🚀', 'received');
            }, 1200);
        }

        function handleMainKey(e) {
            if (e.key === 'Enter') sendMainMessage();
        }

        // Siflow AI Smart Logic
        function sendAiMessage() {
            const input = document.getElementById('aiInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('aiMessages', text, 'sent');
            input.value = '';

            showTyping('aiTyping', true);

            setTimeout(() => {
                showTyping('aiTyping', false);
                const reply = getSiflowAiReply(text);
                appendMessage('aiMessages', reply, 'received', true);
            }, 1000);
        }

        function handleAiKey(e) {
            if (e.key === 'Enter') sendAiMessage();
        }

        function appendMessage(containerId, text, type, isAi = false) {
            const container = document.getElementById(containerId);
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            if (isAi) {
                msgDiv.style.borderLeft = '3px solid #38bdf8';
            }
            msgDiv.innerHTML = `
                ${text}
                <div class="message-time">${getTimeString()}</div>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping(typingId, show) {
            const typingEl = document.getElementById(typingId);
            typingEl.style.display = show ? 'flex' : 'none';
            const container = typingEl.parentElement;
            container.scrollTop = container.scrollHeight;
        }

        function getSiflowAiReply(query) {
            const q = query.toLowerCase();
            if (q.includes('أسامة') || q.includes('سيف الدين') || q.includes('البطل')) {
                return 'أسامة سيف الدين هو بطل الرياضة، ومحترف Sanda وملاكم مميز، وصاحب أفكار إبداعية لا تنتهي في البرمجة وتصميم المواقع!';
            } else if (q.includes('مرحبا') || q.includes('السلام') || q.includes('اهلين')) {
                return 'أهلاً بك! أنا Siflow AI، مساعدك الذكي الخاص هنا لخدمتك والإجابة عن كل ما ترغب بمعرفته. كيف يمكنني مساعدتك اليوم؟';
            } else if (q.includes('شكون أنت') || q.includes('من أنت') || q.includes('what is siflow')) {
                return 'أنا Siflow AI، مساعد ذكي تم تصميمه خصيصاً ليكون رفيقك الرقمي داخل هذا الموقع الرائع!';
            } else if (q.includes('يوتيوب') || q.includes('fivem') || q.includes('ghost recon')) {
                return 'أوسامة يبدع دائماً في محتوى الألعاب وFiveM وGhost Recon Breakpoint، إضافة إلى المونتاج والأفكار السينمائية الرائعة!';
            } else {
                return `سؤال ذكي جداً! بصفتي Siflow AI، أسعد دائماً بالإجابة عن: "${query}". كل الأمور تحت السيطرة وجاهزة لتلبية طلباتك! ✨`;
            }
        }
    </script>
</body>
</html>
