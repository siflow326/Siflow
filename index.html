<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Secret Space ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* خلفية هالو كيتي كيوت ومتنوعة وغير متكررة */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle, rgba(244,63,94,0.06) 10%, transparent 10%),
                url('https://i.pinimg.com/originals/8e/52/63/8e5263a23a31bb36371714bc1912f2ee.png'), 
                url('https://i.pinimg.com/736x/82/35/6c/82356c2227d825c952b610c144e3752e.jpg'),
                url('https://i.pinimg.com/736x/2c/8f/c7/2c8fc72545bc6c8872b8140db59cb833.jpg'),
                url('https://i.pinimg.com/736x/e4/14/67/e4146747b6672323a63327d55f013d7e.jpg');
            background-repeat: repeat, space, space, space, space;
            background-size: 160px, 130px, 140px, 120px, 150px;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        h1 {
            color: #f43f5e;
            margin-top: 20px;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
        }
        .couple-name {
            font-size: 1.1rem;
            color: #fb7185;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(244, 63, 94, 0.3);
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }
        .counter-box {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.1);
        }
        .timer {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }
        .time-unit {
            display: flex;
            flex-direction: column;
        }
        .time-num {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fb7185;
        }
        .time-label {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .btn-miss {
            background: linear-gradient(135deg, #e11d48, #f43f5e);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }
        .btn-miss:active {
            transform: scale(0.97);
        }
        .message-box {
            display: none;
            background: rgba(244, 63, 94, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid #f43f5e50;
            color: #fda4af;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            line-height: 1.6;
            animation: fadeIn 0.4s ease-in-out;
            font-size: 1.05rem;
            font-weight: 500;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: right;
            border-right: 4px solid #f43f5e;
            position: relative;
        }
        .card h3 {
            font-size: 1rem;
            color: #f8fafc;
            margin-bottom: 5px;
        }
        .card p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .card img, .card video {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            max-height: 300px;
            object-fit: cover;
        }
        /* لوحة التحكم السرية */
        .admin-panel {
            display: none;
            background: #020617;
            border: 1px solid #f43f5e;
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
            text-align: right;
        }
        .admin-panel h3 {
            color: #f43f5e;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 5px;
        }
        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px 0;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .admin-panel button {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .delete-btn {
            background: #ef4444 !important;
            font-size: 0.75rem;
            padding: 4px 8px;
            float: left;
        }
        .list-item {
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 onclick="secretAdminTrigger()">مساحتنا الخاصة ❤️</h1>
    <div class="couple-name">AMINA ♾️ OUSSAMA</div>
    <p class="subtitle">كل لحظة معك هي بداية لذكرى أجمل</p>

    <div id="countersContainer"></div>

    <button class="btn-miss" onclick="showRandomMessage()">اضغطي هنا عندما تشتاقين لي 💌</button>
    <div class="message-box" id="secretMessage"></div>

    <div id="memoriesContainer"></div>

    <div class="admin-panel" id="adminPanel">
        <h3>لوحة التحكم الخاصة بك 🔒</h3>
        
        <h3>إدارة رسائل الشوق</h3>
        <textarea id="newRandomMsg" placeholder="اكتب رسالة جديدة..."></textarea>
        <button onclick="addRandomMessage()">إضافة رسالة جديدة</button>
        <div id="adminRandomList" style="max-height: 120px; overflow-y: auto; margin-bottom: 15px;"></div>

        <h3>إضافة مناسبة أو عداد جديد</h3>
        <input type="text" id="eventTitle" placeholder="اسم المناسبة">
        <input type="date" id="eventDate">
        <button onclick="addEvent()">إضافة المناسبة</button>
        <div id="adminEventsList" style="max-height: 120px; overflow-y: auto; margin-bottom: 15px;"></div>

        <h3>إضافة ذكرى جديدة</h3>
        <input type="text" id="memTitle" placeholder="عنوان الذكرى">
        <textarea id="memDesc" placeholder="تفاصيل الذكرى..."></textarea>
        <input type="text" id="memMedia" placeholder="رابط الصورة أو الفيديو (مباشر URL)">
        <button onclick="addMemory()">حفظ ونشر الذكرى</button>
        <div id="adminMemoriesList" style="max-height: 150px; overflow-y: auto;"></div>
        
        <button style="background:#334155; width:100%; margin-top:15px;" onclick="closeAdmin()">إغلاق لوحة التحكم</button>
    </div>
</div>

<script>
    let defaultMessages = [
        "تذكري دائماً أنكِ أجمل جزء في يومي وحياتي كلها! ❤️",
        "حتى وأنتِ بعيدة، أنتِ أقرب شيء لقلبي في كل ثانية. 🌸",
        "مهما كان يومكِ متعباً، تذكري أن هناك شخصاً يحبكِ جداً وينتظر ضحكتكِ! 🥰",
        "عيناكِ هما وطني الأمان، وكل مكان معكِ يصبح جنة صغيرة. ✨",
        "أنتِ النبض الذي يحرك حياتي، والابتسامة التي تزين وجهي دوماً."
    ];

    let randomMessages = JSON.parse(localStorage.getItem('my_messages')) || defaultMessages;

    let events = JSON.parse(localStorage.getItem('my_events')) || [
        { id: 1, title: "بداية تعارفنا ✨", date: "2025-03-02" },
        { id: 2, title: "تاريخ ارتباطنا الرسمي ❤️", date: "2026-01-01" }
    ];

    let memories = JSON.parse(localStorage.getItem('my_memories')) || [
        { id: 1, title: "أول لقاء مميز ✨", desc: "اليوم الذي بدأت فيه أحلى قصة.", media: "" }
    ];

    function renderCounters() {
        const container = document.getElementById('countersContainer');
        container.innerHTML = '';
        events.forEach(ev => {
            container.innerHTML += `
                <div class="counter-box">
                    <p style="color: #fda4af; font-size: 0.85rem; font-weight: bold;">${ev.title}:</p>
                    <div class="timer" data-date="${ev.date}">
                        <div class="time-unit"><span class="time-num years">0</span><span class="time-label">سنة</span></div>
                        <div class="time-unit"><span class="time-num months">0</span><span class="time-label">شهر</span></div>
                        <div class="time-unit"><span class="time-num days">0</span><span class="time-label">يوم</span></div>
                        <div class="time-unit"><span class="time-num hours">0</span><span class="time-label">ساعة</span></div>
                        <div class="time-unit"><span class="time-num minutes">0</span><span class="time-label">دقيقة</span></div>
                        <div class="time-unit"><span class="time-num seconds">0</span><span class="time-label">ثانية</span></div>
                    </div>
                </div>
            `;
        });
    }

    function updateTimers() {
        const now = new Date();
        document.querySelectorAll('.timer').forEach(timer => {
            const targetDate = new Date(timer.getAttribute('data-date'));
            let diff = now - targetDate;
            if(diff > 0) {
                let years = now.getFullYear() - targetDate.getFullYear();
                let months = now.getMonth() - targetDate.getMonth();
                let days = now.getDate() - targetDate.getDate();

                if (days < 0) {
                    months--;
                    let prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                    days += prevMonth.getDate();
                }
                if (months < 0) {
                    years--;
                    months += 12;
                }

                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                timer.querySelector('.years').innerText = years;
                timer.querySelector('.months').innerText = months;
                timer.querySelector('.days').innerText = days;
                timer.querySelector('.hours').innerText = hours;
                timer.querySelector('.minutes').innerText = minutes;
                timer.querySelector('.seconds').innerText = seconds;
            }
        });
    }
    setInterval(updateTimers, 1000);

    function renderMemories() {
        const container = document.getElementById('memoriesContainer');
        container.innerHTML = '';
        memories.forEach(mem => {
            let mediaHTML = '';
            if(mem.media) {
                if(mem.media.includes('mp4') || mem.media.includes('webm') || mem.media.includes('video')) {
                    mediaHTML = `<video src="${mem.media}" controls></video>`;
                } else {
                    mediaHTML = `<img src="${mem.media}" alt="Memory Media">`;
                }
            }
            container.innerHTML += `
                <div class="card">
                    <h3>${mem.title}</h3>
                    <p>${mem.desc}</p>
                    ${mediaHTML}
                </div>
            `;
        });
    }

    function showRandomMessage() {
        const msgBox = document.getElementById('secretMessage');
        if(randomMessages.length === 0) {
            msgBox.innerText = "لا توجد رسائل مضافة بعد!";
        } else {
            const randomIdx = Math.floor(Math.random() * randomMessages.length);
            msgBox.innerText = randomMessages[randomIdx];
        }
        msgBox.style.display = 'block';
    }

    let clickCount = 0;
    function secretAdminTrigger() {
        clickCount++;
        setTimeout(() => { clickCount = 0; }, 1000);
        if (clickCount === 3) {
            clickCount = 0;
            const pwd = prompt("أدخل كلمة السر الخاصة بك (1976):");
            if (pwd === "1976") {
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminLists();
            } else if (pwd !== null) {
                alert("كلمة السر خاطئة!");
            }
        }
    }

    function closeAdmin() {
        document.getElementById('adminPanel').style.display = 'none';
    }

    function renderAdminLists() {
        const rList = document.getElementById('adminRandomList');
        rList.innerHTML = '';
        randomMessages.forEach((msg, idx) => {
            rList.innerHTML += `<div class="list-item"><span>${msg.substring(0,30)}...</span> <button class="delete-btn" onclick="deleteRandom(${idx})">حذف</button></div>`;
        });

        const eList = document.getElementById('adminEventsList');
        eList.innerHTML = '';
        events.forEach((ev, idx) => {
            eList.innerHTML += `<div class="list-item"><span>${ev.title} (${ev.date})</span> <button class="delete-btn" onclick="deleteEvent(${idx})">حذف</button></div>`;
        });

        const mList = document.getElementById('adminMemoriesList');
        mList.innerHTML = '';
        memories.forEach((mem, idx) => {
            mList.innerHTML += `<div class="list-item"><span>${mem.title}</span> <button class="delete-btn" onclick="deleteMemory(${idx})">حذف</button></div>`;
        });
    }

    function addRandomMessage() {
        const txt = document.getElementById('newRandomMsg').value;
        if(txt) {
            randomMessages.push(txt);
            localStorage.setItem('my_messages', JSON.stringify(randomMessages));
            document.getElementById('newRandomMsg').value = '';
            renderAdminLists();
            alert("تمت الإضافة بنجاح!");
        }
    }
    function deleteRandom(idx) {
        randomMessages.splice(idx, 1);
        localStorage.setItem('my_messages', JSON.stringify(randomMessages));
        renderAdminLists();
    }

    function addEvent() {
        const title = document.getElementById('eventTitle').value;
        const date = document.getElementById('eventDate').value;
        if(title && date) {
            events.push({ id: Date.now(), title, date });
            localStorage.setItem('my_events', JSON.stringify(events));
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            renderCounters();
            renderAdminLists();
            alert("تمت إضافة المناسبة بنجاح!");
        }
    }
    function deleteEvent(idx) {
        events.splice(idx, 1);
        localStorage.setItem('my_events', JSON.stringify(events));
        renderCounters();
        renderAdminLists();
    }

    function addMemory() {
        const title = document.getElementById('memTitle').value;
        const desc = document.getElementById('memDesc').value;
        const media = document.getElementById('memMedia').value;
        if(title && desc) {
            memories.unshift({ id: Date.now(), title, desc, media });
            localStorage.setItem('my_memories', JSON.stringify(memories));
            document.getElementById('memTitle').value = '';
            document.getElementById('memDesc').value = '';
            document.getElementById('memMedia').value = '';
            renderMemories();
            renderAdminLists();
            alert("تم نشر الذكرى بنجاح!");
        }
    }
    function deleteMemory(idx) {
        memories.splice(idx, 1);
        localStorage.setItem('my_memories', JSON.stringify(memories));
        renderMemories();
        renderAdminLists();
    }

    renderCounters();
    updateTimers();
    renderMemories();
</script>

</body>
</html>
